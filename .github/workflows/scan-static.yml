# Loop worker (internal): the scan-static lane of isokron-ai/tool-qa. The tool-qa pump dispatches it with
# shard_id, attempt_id and items (tool-qa docs/INTERFACES.md, "Worker dispatch"); each item is a public GitHub
# repository, owner/name, with the run_key and fence its result must quote. corpus/scan-static.mjs reads each
# repository's tool list from source at the head of its default branch, without running, installing or building
# anything, and grades it as `mcp-check --repo` does. tool-qa's worker-kit then seals one bundle per item to
# tool-qa's ingest key and uploads it as result-<attempt_id>-<i>.tar.age. Every item gets a bundle: a subject
# that could not be graded reports a skip. corpus/README.md ("Loop worker: scan-static") says what a bundle holds.
#
# What is public: the log names items by position only and says graded or skipped, with a code; no grade is
# printed. The bundles are encrypted before upload.
#
# Security: workflow_dispatch only, from main; permissions: {} at the top and contents: read only for the jobs
# that check out this repository; no secrets (the job's own token reads public repositories at the
# authenticated rate limit, and only api.github.com sees it). The inputs reach steps through env: only and are
# checked whole before anything is read. The kill switch (corpus/loop-guard.mjs: LOOP_ENABLED,
# LOOP_PAUSE_UNTIL, LANE_SCAN_STATIC_ENABLED) stops the lane without failing a run. Actions are pinned by full SHA.

name: scan-static

on:
  workflow_dispatch:
    inputs:
      shard_id:
        description: Shard id from the tool-qa pump, such as scan-static-3f2a9c01b7d4.
        required: true
        type: string
      attempt_id:
        description: Attempt id from the tool-qa pump; every result quotes it.
        required: true
        type: string
      items:
        description: 'JSON list of 1 to 25 {"subject": "owner/name", "run_key": "<64 hex>", "fence": <n>}.'
        required: true
        type: string

run-name: shard ${{ inputs.shard_id }}

permissions: {}

concurrency:
  group: scan-static-${{ inputs.shard_id }}
  cancel-in-progress: false

env:
  # The isokron-ai/tool-qa commit whose worker-kit seals and uploads the bundles. Every worker-kit step below
  # names this same commit (test/workflows.test.mjs checks), and test/tool-qa/ holds tool-qa's result contract
  # at it (test/tool-qa.test.mjs checks). The all-zero placeholder makes the guard fail the run before anything
  # is read.
  WORKER_KIT_REF: 'b1f25a9b0b7655f45eb353f31562a93d9319d5a4'

jobs:
  guard:
    if: github.repository == 'isokron-ai/mcp-check' && github.ref == 'refs/heads/main'
    name: scan-static-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      # First, before anything is checked out: LOOP_ENABLED must be exactly "true". Off is a notice, not a failure.
      - id: enabled
        name: Kill switch (LOOP_ENABLED)
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
        run: |
          if [[ "$LOOP_ENABLED" == "true" ]]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "::notice title=scan-static::LOOP_ENABLED is not \"true\"; the loop is off and nothing is read"; fi
      - if: steps.enabled.outputs.on == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: corpus/loop-guard.mjs
          sparse-checkout-cone-mode: false
      - id: guard
        if: steps.enabled.outputs.on == 'true'
        name: Kill switch (pause, lane switch, worker-kit pin)
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LOOP_PAUSE_UNTIL: ${{ vars.LOOP_PAUSE_UNTIL }}
          LANE_SCAN_STATIC_ENABLED: ${{ vars.LANE_SCAN_STATIC_ENABLED }}
        run: node corpus/loop-guard.mjs --lane scan-static

  scan:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    name: scan-static
    runs-on: ubuntu-24.04
    # Below the pump's lease for a shard of 25: 1.5 x (3 + 25 x 1) + 10 = 52 minutes. The script starts no
    # subject after 32 minutes; those not started report a retryable skip (shard_deadline).
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Again, first: the switches may have changed since the guard job read them (R-SS-06). Off now stops the job,
      # red, before anything is checked out or read.
      - name: Kill switch, again (LOOP_ENABLED, LANE_SCAN_STATIC_ENABLED)
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LANE_SCAN_STATIC_ENABLED: ${{ vars.LANE_SCAN_STATIC_ENABLED }}
        run: |
          if [[ "$LOOP_ENABLED" != "true" ]]; then echo "::error title=scan-static::LOOP_ENABLED was switched off after the guard job; nothing is read"; exit 1; fi
          if [[ -n "$LANE_SCAN_STATIC_ENABLED" && "$LANE_SCAN_STATIC_ENABLED" != "true" ]]; then echo "::error title=scan-static::the scan-static lane was switched off after the guard job; nothing is read"; exit 1; fi
      - name: Check the inputs
        env:
          SHARD_ID: ${{ inputs.shard_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          ITEMS: ${{ inputs.items }}
        run: |
          # Whole-string checks: a newline or control character anywhere fails the match. corpus/scan-static.mjs
          # checks the items in full (JSON, 1 to 25 entries, run_key, fence) before anything is read.
          id_re='^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          items_re='^\[[^[:cntrl:]]+\]$'
          if [[ ! "$SHARD_ID" =~ $id_re ]]; then echo "::error title=scan-static::shard_id is malformed"; exit 1; fi
          if [[ ! "$ATTEMPT_ID" =~ $id_re ]]; then echo "::error title=scan-static::attempt_id is malformed"; exit 1; fi
          if [[ ! "$ITEMS" =~ $items_re ]] || [ "${#ITEMS}" -gt 60000 ]; then echo "::error title=scan-static::items must be one line of JSON, a list of at most 60000 characters"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # Its own limit, below the job's 45 minutes, so the upload steps still run if it is stopped: each item's outputs
      # are written as soon as its bundle is (R-SS-02). No subject starts after 32 minutes; one takes at most 90 s.
      - id: scan
        name: Read and grade the subjects
        timeout-minutes: 37
        env:
          SHARD_ID: ${{ inputs.shard_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          ITEMS: ${{ inputs.items }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node corpus/scan-static.mjs run "$RUNNER_TEMP/scan-static"
      # One step per item (at most 25, the shard size; has_<i> is set for every dispatched item). One item's
      # failed upload does not stop the others. Uploads need the controls to have passed (controls_ok) and none to
      # have failed since (controls_failed), not the scan step's success: a scan step stopped at its time limit
      # still uploads every bundle it finished.
      - name: Seal and upload item 0
        if: ${{ !cancelled() && steps.scan.outputs.controls_ok == 'true' && steps.scan.outputs.controls_failed != 'true' && steps.scan.outputs.has_0 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/scan-static/0/bundle
          meta-file: ${{ runner.temp }}/scan-static/0/meta.json
          attempt-id: ${{ inputs.attempt_id }}
          item-index: '0'
          fence: ${{ steps.scan.outputs.fence_0 }}
          run-key: ${{ steps.scan.outputs.run_key_0 }}
      - name: Seal and upload item 1
        if: ${{ !cancelled() && steps.scan.outputs.controls_ok == 'true' && steps.scan.outputs.controls_failed != 'true' && steps.scan.outputs.has_1 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
