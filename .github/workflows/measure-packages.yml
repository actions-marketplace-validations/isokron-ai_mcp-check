# TEMPORARY: a measurement of the live-probe lane's package types on real seed subjects, for the pull request that adds
# them. Removed (and its registration disabled) before the pull request is final. The same steps as
# live-probe-selftest.yml up to the bundle step (sandbox conformance, sandbox guard, plan, sandbox, bundle), on the
# seed list's subjects whose only packages are of the measured types, a few per job; no oracle stage, no worker kit.
# Each job keeps only each item's results/live-probe.json (status, detail codes, counts: no raw/ text).
#
# No secret, a token with contents: read only, no pull_request_target. Subjects run only in the sandbox.

name: measure-packages

on:
  pull_request:
    paths:
      - .github/workflows/measure-packages.yml

permissions: {}

concurrency:
  group: measure-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKER_KIT_REF: '2ffcea16117ec679398f83eefe8c6fa66d38bac6'
  SURFACE_CORPUS_REF: 'd18584310896323ade95a94e7f6e9dcd07ede0de'
  # The package types measured, and how many subjects a job takes.
  MEASURE_TYPES: 'mcpb'
  PER_JOB: '6'
  MAX_SHARDS: '1000'

jobs:
  sandbox:
    permissions:
      contents: read
    uses: isokron-ai/mcp-surface-corpus/.github/workflows/sandbox-conformance.yml@d18584310896323ade95a94e7f6e9dcd07ede0de # SURFACE_CORPUS_REF
    with:
      mutations: false
      artifact-prefix: measure-sandbox

  subjects:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.pick.outputs.shards }}
    steps:
      - name: Check out the seed list (isokron-ai/tool-qa)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/tool-qa
          ref: ${{ env.WORKER_KIT_REF }}
          path: tool-qa
          sparse-checkout: |
            history/seed-v1.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: pick
        name: The seed subjects whose only packages are of the measured types, in shards
        run: |
          node -e '
            const types = process.env.MEASURE_TYPES.split(",");
            const per = Number(process.env.PER_JOB);
            const seed = JSON.parse(require("fs").readFileSync("tool-qa/history/seed-v1.json", "utf8"));
            const ids = seed.subjects.filter((s) => { const r = new Set((s.packages || []).map((p) => p.registry)); return r.size && [...r].every((x) => types.includes(x)); }).map((s) => s.id).sort();
            const shards = [];
            const max = Number(process.env.MAX_SHARDS || 1000);
            for (let i = 0; i < ids.length && shards.length < max; i += per) shards.push({ n: shards.length, items: JSON.stringify(ids.slice(i, i + per).map((subject, k) => ({ subject, run_key: (i + k + 1).toString(16).padStart(64, "0"), fence: i + k + 1 }))) });
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "shards=" + JSON.stringify(shards) + "\n");
            console.log(ids.length + " subjects in " + shards.length + " jobs");
          '

  measure:
    needs: [sandbox, subjects]
    if: needs.sandbox.outputs.verdict == 'pass'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        shard: ${{ fromJSON(needs.subjects.outputs.shards) }}
    steps:
      - name: Dispatch inputs
        env:
          RUN_ID: ${{ github.run_id }}
          N: ${{ matrix.shard.n }}
          ITEMS: ${{ matrix.shard.items }}
        run: |
          {
            echo "SHARD_ID=measure-$RUN_ID-$N"
            echo "ATTEMPT_ID=measure-$RUN_ID-$N"
            echo "ITEMS=$ITEMS"
          } >> "$GITHUB_ENV"
      - id: deadline
        run: echo "at=$(( $(date +%s) + 34 * 60 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check out the sandbox (isokron-ai/mcp-surface-corpus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-surface-corpus
          ref: ${{ env.SURFACE_CORPUS_REF }}
          path: surface-corpus
          persist-credentials: false
      - name: Check out the seed list (isokron-ai/tool-qa)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/tool-qa
          ref: ${{ env.WORKER_KIT_REF }}
          path: tool-qa
          sparse-checkout: |
            history/seed-v1.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: guard
        name: Sandbox guard on this runner (mcp-surface-corpus sandbox-guard)
        uses: isokron-ai/mcp-surface-corpus/sandbox-guard@d18584310896323ade95a94e7f6e9dcd07ede0de # SURFACE_CORPUS_REF
        with:
          out: ${{ runner.temp }}/live-probe/selftest
      - id: plan
        name: Resolve each subject's install method
        run: node corpus/live-probe.mjs plan "$RUNNER_TEMP/live-probe" --msc surface-corpus --seed tool-qa/history/seed-v1.json
      - id: sandbox
        name: Run the controls and subjects in the sandbox
        env:
          GH_TOKEN: ${{ github.token }}
          DEADLINE: ${{ steps.deadline.outputs.at }}
          GUARD_VERDICT: ${{ steps.guard.outputs.verdict }}
          GUARD_SHA: ${{ steps.guard.outputs.sandbox-sha }}
          ORACLE_CLIENTS: none
        run: corpus/live-probe-sandbox.sh "$RUNNER_TEMP/live-probe" surface-corpus "$DEADLINE"
      - id: bundle
        name: Check the controls and build the bundles
        env:
          MCP_CHECK_COMMIT: ${{ github.sha }}
        run: node corpus/live-probe.mjs bundle "$RUNNER_TEMP/live-probe"
      - name: Keep each item's result (codes and counts only)
        if: always()
        env:
          N: ${{ matrix.shard.n }}
        run: |
          mkdir -p "$RUNNER_TEMP/measure"
          node -e '
            const fs = require("fs"); const path = require("path");
            const w = process.env.RUNNER_TEMP + "/live-probe";
            const plan = JSON.parse(fs.readFileSync(w + "/plan.json", "utf8"));
            const rows = plan.items.map((it) => {
              let r = null;
              try { r = JSON.parse(fs.readFileSync(path.join(w, "out", String(it.index), "bundle", "results", "live-probe.json"), "utf8")); } catch {}
              let rec = null;
              try { rec = JSON.parse(fs.readFileSync(path.join(w, it.target && it.target.launch.kind === "cargo" ? "driver-builds" : "driver-subjects", it.target_id || "none", "record.json"), "utf8")); } catch {}
              const steps = rec && rec.install && Array.isArray(rec.install.steps) ? rec.install.steps.map((s) => ({ name: s.name, exit: s.exit, ms: s.ms, timed_out: s.timed_out, error: s.result && s.result.error || null, result: s.result && s.result.error ? s.result : null })) : null;
              return { subject: it.subject, kind: it.target ? it.target.launch.kind : null, type: it.resolution.choice ? it.resolution.choice.type : null, plan_detail: it.resolution.detail, status: r ? r.status : null, detail: r ? r.detail : null, skip_reason: r ? r.skip_reason : null, fault: r ? r.fault : null, tool_count: r && r.live ? r.live.tool_count : null, install_steps: steps, egress: rec && rec.install && Array.isArray(rec.install.egress) ? rec.install.egress.slice(0, 20).map((e) => ({ host: e.host, allowed: e.allowed, error: e.error || null, up: e.up, down: e.down })) : null, timing: r ? r.timing : null };
            });
            fs.writeFileSync(process.env.RUNNER_TEMP + "/measure/shard-" + process.env.N + ".json", JSON.stringify(rows, null, 1));
            for (const x of rows) console.log(JSON.stringify(x));
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: measure-${{ matrix.shard.n }}
          path: ${{ runner.temp }}/measure/
          retention-days: 7

  summary:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: measure-[0-9]*
          path: m
          merge-multiple: true
      - name: Count
        run: |
          node -e '
            const fs = require("fs");
            const rows = fs.readdirSync("m").flatMap((f) => JSON.parse(fs.readFileSync("m/" + f, "utf8")));
            const by = {};
            for (const r of rows) { const k = (r.type || "none") + " " + (r.status === "graded" ? "graded" : (r.detail || r.plan_detail || "no result")); by[k] = (by[k] || 0) + 1; }
            const lines = ["| type, outcome | subjects |", "|---|---|", ...Object.entries(by).sort().map(([k, v]) => "| " + k + " | " + v + " |"), "", rows.length + " subjects; " + rows.filter((r) => r.status === "graded").length + " listed tools and were graded."];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '
