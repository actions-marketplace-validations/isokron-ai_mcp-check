# Self test of the live-probe lane on GitHub (corpus/LIVE-PROBE.md). live-probe.yml is dispatch-only and runs only
# from main, so this workflow runs the same lane end to end on every pull request that touches it: a fixture shard of
# our own repositories (corpus/fixtures/live-probe/selftest-shard.json), resolved from the real registry and seed list, run in
# the real sandbox (gVisor, the self test, the firewall), graded, bundled with tool-qa's worker-kit at WORKER_KIT_REF
# in dry-run mode (built and checked, never encrypted or uploaded), and then judged by tool-qa's own ingest code at the
# same commit: manifest schema, identity and file checks, identity claims outside raw/, the controls, the field
# registry and the secret scan, plus each fixture item's expected outcome.
#
# The steps from "Deadline for the subjects" to "Check the controls and build the bundles" are the same as in
# live-probe.yml (test/live-probe.test.mjs checks), only the inputs come from the fixture.
#
# No secret, a token with contents: read only, no pull_request_target. Only our own servers run, in the sandbox.

name: live-probe-selftest

on:
  pull_request:
    paths:
      - .github/workflows/live-probe.yml
      - .github/workflows/live-probe-selftest.yml
      - corpus/live-probe.mjs
      - corpus/live-probe-sandbox.sh
      - corpus/fixtures/live-probe/**
      - corpus/loop-guard.mjs
      - src/**
      - engine/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: live-probe-selftest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORKER_KIT_REF: 'b1f25a9b0b7655f45eb353f31562a93d9319d5a4'
  SURFACE_CORPUS_REF: '73a2669ca3d571bc50c5deab1cd171bc4a70ddda'
  # The tool-qa commit whose ingest judges the bundles here: tool-qa's main as it runs for real, with the field registry
  # it pins (mcp-results f2b16de since tool-qa #14). The worker kit that builds them stays at WORKER_KIT_REF.
  INGEST_REF: '4d525316c930e34b8a6e031e87e2484aad555a53'

jobs:
  # The pinned sandbox's own conformance check (mcp-surface-corpus's reusable workflow, at SURFACE_CORPUS_REF), on a
  # runner of its own: gVisor, the firewall and the hostile self test, passed only when its telemetry recomputes a pass.
  sandbox:
    permissions:
      contents: read
    uses: isokron-ai/mcp-surface-corpus/.github/workflows/sandbox-conformance.yml@73a2669ca3d571bc50c5deab1cd171bc4a70ddda # SURFACE_CORPUS_REF
    with:
      mutations: false
      artifact-prefix: live-probe-sandbox

  selftest:
    needs: sandbox
    if: needs.sandbox.outputs.verdict == 'pass'
    name: live-probe-selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: The fixture shard as dispatch inputs
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]{1,20}$ && "$RUN_ATTEMPT" =~ ^[0-9]{1,5}$ ]]
          {
            echo "SHARD_ID=live-probe-selftest-$RUN_ID-$RUN_ATTEMPT"
            echo "ATTEMPT_ID=selftest-$RUN_ID-$RUN_ATTEMPT"
          } >> "$GITHUB_ENV"
      - id: deadline
        name: Deadline for the subjects
        run: echo "at=$(( $(date +%s) + 34 * 60 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The fixture items
        run: echo "ITEMS=$(jq -c '[.items[] | {subject, run_key, fence}]' corpus/fixtures/live-probe/selftest-shard.json)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check out the sandbox (isokron-ai/mcp-surface-corpus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-surface-corpus
          ref: ${{ env.SURFACE_CORPUS_REF }}
          path: surface-corpus
          persist-credentials: false
      - name: Check out the seed list and worker kit (isokron-ai/tool-qa)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/tool-qa
          ref: ${{ env.WORKER_KIT_REF }}
          path: tool-qa
          sparse-checkout: |
            history/seed-v1.json
            worker-kit/
            ingest/
            scripts/lib/yaml-lite.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Before any target, on this runner: the same sandbox guard (gVisor, the firewall, the hostile self test and its
      # telemetry check), from the commit SURFACE_CORPUS_REF pins. It fails the job unless the verdict is pass.
      - id: guard
        name: Sandbox guard on this runner (mcp-surface-corpus sandbox-guard)
        uses: isokron-ai/mcp-surface-corpus/sandbox-guard@73a2669ca3d571bc50c5deab1cd171bc4a70ddda # SURFACE_CORPUS_REF
        with:
          out: ${{ runner.temp }}/live-probe/selftest
      # Registry and GitHub reads only (JSON, fixed hosts): nothing of a subject is fetched to run here.
      - id: plan
        name: Resolve each subject's install method
        env:
          SHARD_ID: ${{ env.SHARD_ID }}
          ATTEMPT_ID: ${{ env.ATTEMPT_ID }}
          ITEMS: ${{ env.ITEMS }}
        run: node corpus/live-probe.mjs plan "$RUNNER_TEMP/live-probe" --msc surface-corpus --seed tool-qa/history/seed-v1.json
      # Every subject runs in the sandbox's containers, never in this shell. The step ends only after the sandbox is
      # gone: no container or volume at all, no process of uid 65534, no runsc process.
      - id: sandbox
        name: Run the controls and subjects in the sandbox
        env:
          # Read-only token, for the GitHub API's rate limit when the driver reads repository facts; sent to
          # api.github.com only, never to a container.
          GH_TOKEN: ${{ github.token }}
          DEADLINE: ${{ steps.deadline.outputs.at }}
          GUARD_VERDICT: ${{ steps.guard.outputs.verdict }}
          GUARD_SHA: ${{ steps.guard.outputs.sandbox-sha }}
        run: corpus/live-probe-sandbox.sh "$RUNNER_TEMP/live-probe" surface-corpus "$DEADLINE"
      - id: bundle
        name: Check the controls and build the bundles
        run: node corpus/live-probe.mjs bundle "$RUNNER_TEMP/live-probe"
      - name: Build and check bundle 0 (dry run)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.plan.outputs.has_0 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/live-probe/out/0/bundle
          meta-file: ${{ runner.temp }}/live-probe/out/0/meta.json
          attempt-id: ${{ env.ATTEMPT_ID }}
          item-index: '0'
          fence: ${{ steps.plan.outputs.fence_0 }}
          run-key: ${{ steps.plan.outputs.run_key_0 }}
          dry-run: 'true'
      - name: Build and check bundle 1 (dry run)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.plan.outputs.has_1 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/live-probe/out/1/bundle
          meta-file: ${{ runner.temp }}/live-probe/out/1/meta.json
          attempt-id: ${{ env.ATTEMPT_ID }}
          item-index: '1'
          fence: ${{ steps.plan.outputs.fence_1 }}
          run-key: ${{ steps.plan.outputs.run_key_1 }}
          dry-run: 'true'
      - name: Build and check bundle 2 (dry run)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.plan.outputs.has_2 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/live-probe/out/2/bundle
          meta-file: ${{ runner.temp }}/live-probe/out/2/meta.json
          attempt-id: ${{ env.ATTEMPT_ID }}
          item-index: '2'
          fence: ${{ steps.plan.outputs.fence_2 }}
          run-key: ${{ steps.plan.outputs.run_key_2 }}
          dry-run: 'true'
      - name: Check out tool-qa's ingest (isokron-ai/tool-qa at INGEST_REF)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/tool-qa
          ref: ${{ env.INGEST_REF }}
          path: tool-qa-ingest
          sparse-checkout: |
            worker-kit/
            ingest/
            scripts/lib/yaml-lite.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Judge the bundles with tool-qa's ingest code
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: node corpus/live-probe.mjs verify --ingest tool-qa-ingest tool-qa corpus/fixtures/live-probe/selftest-shard.json "$RUNNER_TEMP"/tool-qa-result/*.tar
      - name: Keep the bundles and the sandbox's records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-probe-selftest
          path: |
            ${{ runner.temp }}/tool-qa-result/*.tar
            ${{ runner.temp }}/live-probe/plan.json
            ${{ runner.temp }}/live-probe/sandbox.json
            ${{ runner.temp }}/live-probe/selftest-check.txt
            ${{ runner.temp }}/live-probe/selftest/results.json
          if-no-files-found: warn
          retention-days: 7
