# Tests every pull request and every push to main on GitHub's runners.
#
#   test        npm test on Node 20, 22 and 24 (the engine, the CLI, the MCP server, the Action script,
#               the corpus grader), the engine's vendored hashes, and what npm would publish
#   action      the Action itself (uses: ./) on a saved list, before any npm install (the Action runs
#               with no dependencies), then on this package's own server, with a min-grade A gate, no
#               SARIF upload and no badge
#   zero-config the Action with no inputs on this repository, exactly as the docs show it: it reads the
#               tool definitions from src/server.js, runs nothing, and needs no setup-node or install
#   bench       the adversarial benchmark (bench/README.md): scores every case and runs the gate (bench/gate.mjs)
#               against bench/baseline.json: any new per-case miss or false alarm, a fall in coverage, or an
#               improvement not locked into the baseline fails it
#   mutants     the benchmark's mutant pass (bench/mutate.mjs), in full when src/, engine/ or bench/ changed (about
#               two minutes), skipped with a notice otherwise; fails when a mutant on the kill list survives
#   ci-ok       passes only if every job above succeeded: the one required status check
#
# No secrets, read-only token, no pull_request_target: a pull request from a fork runs with the same
# permissions as any other.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Engine files match engine/VENDORED.json
        run: npm run vendor:verify
      - name: What npm would publish
        if: matrix.node == '22'
        run: npm pack --dry-run

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The Action needs no npm install: this step runs before any dependency exists in the checkout.
      - name: No node_modules yet
        run: test ! -e node_modules
      - name: A saved tool list
        id: file
        uses: ./
        with:
          tools-file: test/catalogs/well-designed.json
          min-grade: A
          sections: spec,anthropic,openai,security,quality
          artifact-name: mcp-check-file
          results-dir: mcp-check-file
      # The server under test (this package's MCP server) needs its own dependencies, as any user's would.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: This package's own MCP server
        id: server
        uses: ./
        with:
          command: node bin/mcp-check-server.js
          min-grade: A
          artifact-name: mcp-check-server
          results-dir: mcp-check-server
      - name: The outputs are set
        env:
          FILE_PASSED: ${{ steps.file.outputs.passed }}
          SERVER_PASSED: ${{ steps.server.outputs.passed }}
          SERVER_ANTHROPIC: ${{ steps.server.outputs.grade-anthropic }}
        run: |
          [ "$FILE_PASSED" = true ] && [ "$SERVER_PASSED" = true ] && [ "$SERVER_ANTHROPIC" = A ] \
            || { echo "::error::unexpected outputs: $FILE_PASSED $SERVER_PASSED $SERVER_ANTHROPIC"; exit 1; }

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Score every case
        run: node bench/run.mjs --json bench-score.json --md bench-score.md
      - name: The score in the job summary
        run: cat bench-score.md >> "$GITHUB_STEP_SUMMARY"
      - name: The gate against bench/baseline.json
        run: node bench/gate.mjs --score bench-score.json

  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does this change touch reader, check or benchmark code?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            [[ "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::unexpected base ref"; exit 1; }
            range="origin/$BASE_REF...HEAD"
          else
            [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || { echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }
            range="$BEFORE...HEAD"
          fi
          if ! git diff --name-only "$range" > changed.txt; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -qE '^(src/|engine/|bench/)' changed.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no change under src/, engine/ or bench/: the mutant pass is skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - if: steps.scope.outputs.run == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The mutant pass
        if: steps.scope.outputs.run == 'true'
        run: node bench/mutate.mjs --jobs 4 --json mutants.json --md mutants.md
      - name: The result in the job summary
        if: always() && steps.scope.outputs.run == 'true'
        run: test -f mutants.md && cat mutants.md >> "$GITHUB_STEP_SUMMARY" || true

  zero-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The zero-config workflow
        id: zero
        uses: ./
      - name: The tools came from the source, and nothing was run
        env:
          SOURCE: ${{ steps.zero.outputs.source }}
          RESULTS: ${{ steps.zero.outputs.results-dir }}
          ANTHROPIC: ${{ steps.zero.outputs.grade-anthropic }}
        run: |
          n=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).tools.map((t) => t.name).sort().join(","))' "$RESULTS/tools-list.json")
          echo "source=$SOURCE tools=$n anthropic=$ANTHROPIC"
          [ "$SOURCE" = repo-static ] && [ "$n" = "check_tools_list,compare_tools_lists,explain_check" ] && [ "$ANTHROPIC" = A ] \
            || { echo "::error::unexpected zero-config result: $SOURCE $n $ANTHROPIC"; exit 1; }
          test ! -e node_modules

  # The required status check (branch protection names this job, not the others).
  ci-ok:
    needs: [test, action, zero-config, bench, mutants]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          n=0
          for r in $RESULTS; do
            n=$((n + 1))
            [ "$r" = success ] || { echo "::error::a required job ended $r"; exit 1; }
          done
          [ "$n" -eq 5 ] || { echo "::error::expected 5 job results, got $n"; exit 1; }
