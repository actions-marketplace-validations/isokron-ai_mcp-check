# T0 worker: the tools/call fuzz stage over our own fixture servers. Dispatch only (tool-qa lane t0-fuzz); no schedule,
# push or pull_request trigger.
#
# Runs corpus/fuzz/calls/matrix.mjs: seeded protocol-fault servers (corpus/fuzz/calls/fixtures/) and the tiny-tracker builds of
# isokron-ai/mcp-write-safety (built here from a pinned commit). It sends tools/call, so it runs ONLY these fixtures
# (corpus/fuzz/calls/fixtures.json), never a third-party server. Every fixture has a known answer: a fault the stage does
# not find, or a finding on a build that expects none, is a defect of OUR stage, never of a subject.
#
# Result: a tool-qa bundle (worker-kit) sealed to tool-qa's ingest key, with controls known_good (no false positive) and
# known_bad (no miss); a control that did not hold is rejected by ingest as control_failed.
# No secrets. The first job does nothing unless the repository variable LOOP_ENABLED is exactly "true".

name: fuzz-calls

run-name: shard ${{ inputs.shard_id }}

on:
  workflow_dispatch:
    inputs:
      shard_id:
        description: T0 shard id (letters, digits, dot, underscore, hyphen; at most 64).
        required: true
        type: string
      attempt_id:
        description: Attempt id (same character set). Names the result artifact result-<attempt_id>-0.tar.age.
        required: true
        type: string
      fence:
        description: Fence token (letters, digits, dot, colon, underscore, hyphen; at most 64).
        required: true
        type: string
      run_key:
        description: Run key (same character set as fence).
        required: true
        type: string

permissions: {}

concurrency:
  group: fuzz-calls-${{ inputs.shard_id }}-${{ inputs.attempt_id }}
  cancel-in-progress: false

env:
  # isokron-ai/mcp-write-safety main, the tiny-tracker builds the stage runs against.
  TINY_TRACKER_REF: '8990c1dc0e771df0b1254ecdee92202d30cd5170'

jobs:
  t0-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      go: ${{ steps.guard.outputs.go }}
      attempt_id: ${{ steps.guard.outputs.attempt_id }}
      fence: ${{ steps.guard.outputs.fence }}
      run_key: ${{ steps.guard.outputs.run_key }}
    steps:
      - id: guard
        name: Kill switch, then validate the inputs
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          IN_SHARD_ID: ${{ inputs.shard_id }}
          IN_ATTEMPT_ID: ${{ inputs.attempt_id }}
          IN_FENCE: ${{ inputs.fence }}
          IN_RUN_KEY: ${{ inputs.run_key }}
        run: |
          if [ "$LOOP_ENABLED" != "true" ]; then
            echo "::notice::LOOP_ENABLED is not 'true'; this T0 worker does nothing."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad=0
          check() { # name value pattern
            # [[ =~ ]] matches the whole string, so a value with a newline is refused.
            if ! [[ "$2" =~ $3 ]]; then echo "::error::input $1 is empty or has a character outside its allowed set"; bad=1; fi
          }
          check shard_id "$IN_SHARD_ID" '^[A-Za-z0-9._-]{1,64}$'
          check attempt_id "$IN_ATTEMPT_ID" '^[A-Za-z0-9._-]{1,64}$'
          check fence "$IN_FENCE" '^[A-Za-z0-9._:-]{1,64}$'
          check run_key "$IN_RUN_KEY" '^[A-Za-z0-9._:-]{1,64}$'
          [ "$bad" -eq 0 ] || exit 1
          {
            echo "go=true"
            echo "attempt_id=$IN_ATTEMPT_ID"
            echo "fence=$IN_FENCE"
            echo "run_key=$IN_RUN_KEY"
          } >> "$GITHUB_OUTPUT"

  fuzz:
    needs: t0-start
    if: needs.t0-start.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ env.TINY_TRACKER_REF }}
          path: mws
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build tiny-tracker
        working-directory: mws/examples/tiny-tracker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Fuzz the fixtures
        run: node corpus/fuzz/calls/matrix.mjs --out "$RUNNER_TEMP/out"
        env:
          TINY_TRACKER_DIR: ${{ github.workspace }}/mws/examples/tiny-tracker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t0fuzz-${{ needs.t0-start.outputs.attempt_id }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 3

  t0-manifest:
    needs: [t0-start, fuzz]
    if: ${{ always() && needs.t0-start.outputs.go == 'true' && needs.fuzz.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Runs none of the fixtures' code: it only seals the bundle the fuzz job wrote.
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: t0fuzz-${{ needs.t0-start.outputs.attempt_id }}
          path: ${{ runner.temp }}/out
      - uses: isokron-ai/tool-qa/worker-kit@b04b7c65c244de48c32f93c7ea9b9ac933ca1efe # tool-qa main, 27 Nov 2026
        with:
          bundle-dir: ${{ runner.temp }}/out/bundle
          meta-file: ${{ runner.temp }}/out/meta.json
          attempt-id: ${{ needs.t0-start.outputs.attempt_id }}
          item-index: 0
          fence: ${{ needs.t0-start.outputs.fence }}
          run-key: ${{ needs.t0-start.outputs.run_key }}
