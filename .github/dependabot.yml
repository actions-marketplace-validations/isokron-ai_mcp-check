# Keeps the SHA-pinned actions and the npm dependencies current. Pull requests only; nothing merges itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # the benchmark's synthetic servers carry package.json files that are never installed
    exclude-paths:
      - "bench/**"
