name: IsoKron MCP check
description: >-
  Grades an MCP server's tools/list against the MCP specification, the Claude and ChatGPT directory
  rules, hidden-instruction patterns and schema quality. Zero-config: with no input it reads the tool
  definitions from your repository's code and runs nothing. Job summary, SARIF, gate, badge, PR comment.
author: IsoKron
branding:
  icon: check-circle
  color: blue

inputs:
  tools-file:
    description: >-
      Path (in the workspace) of a saved tools/list answer: a JSON-RPC answer, {"tools": [...]}, a
      bare array of tools, or an array of pages. Set this or command, not both. With neither, the
      action reads the tool definitions from the source in working-directory and runs nothing.
    required: false
    default: ''
  command:
    description: >-
      Command that starts the MCP server over stdio, e.g. "node dist/index.js". The action sends
      initialize and tools/list (every page) and nothing else: no tool is called. Split into words
      without a shell unless shell is true. Set this or tools-file, not both.
    required: false
    default: ''
  shell:
    description: Run command through bash -c (for pipes, variables or &&). Default false.
    required: false
    default: 'false'
  working-directory:
    description: Folder (in the workspace) the command runs in, or, with neither command nor tools-file, the folder whose source is read.
    required: false
    default: '.'
  timeout:
    description: One overall time limit, in seconds, for starting the server and reading initialize and every tools/list page (1 to 600).
    required: false
    default: '60'
  min-grade:
    description: >-
      Lowest acceptable grade, A to F. The job fails when a section in sections grades below it.
      Empty: no gate (the grades are still reported).
    required: false
    default: ''
  sections:
    description: >-
      Sections to gate with min-grade, comma-separated: spec, anthropic, openai, security, quality,
      surface. Every section is reported either way.
    required: false
    default: spec,anthropic,openai,security
  baseline:
    description: >-
      Optional path of an earlier tools/list answer. The job fails when an annotation changed in a
      way that lets a client run a tool with less confirmation (for example readOnlyHint flipped to true).
    required: false
    default: ''
  sarif:
    description: Write report.sarif into the results folder. Default true.
    required: false
    default: 'true'
  upload-sarif:
    description: >-
      Upload report.sarif to GitHub code scanning (needs permissions security-events: write, and
      code scanning available on the repository). Default false.
    required: false
    default: 'false'
  badge:
    description: >-
      Write a shields.io endpoint file (badge.json) and report.md into badge-dir and commit them,
      on push, schedule and workflow_dispatch runs of the default branch only, and only when the
      grades or the tool list changed. Needs permissions contents: write, and actions/checkout with
      its default persist-credentials: true (the push uses that token). Default false.
    required: false
    default: 'false'
  badge-dir:
    description: Folder of badge.json and report.md, relative to the repository root.
    required: false
    default: .github/mcp-check
  results-dir:
    description: Folder the reports are written to and the artifact is made from.
    required: false
    default: mcp-check-results
  artifact-name:
    description: Name of the uploaded artifact (empty for no artifact). Give each job of a matrix its own name.
    required: false
    default: mcp-check-results
  publish-hint:
    description: >-
      On a public github.com repository, add one line to the job summary (and the PR comment) linking
      to this repository's page in the IsoKron MCP registry, where it can be listed for free. Makes no
      request. Default true; false for no line.
    required: false
    default: 'true'
  pr-comment:
    description: >-
      Comment the grades on pull requests from branches of this repository (never from forks): off,
      auto (only when a gated section is below min-grade or the baseline comparison finds a high-risk
      change; an existing comment is then kept up to date) or always. One comment, updated in place.
      Needs permissions pull-requests: write. Default off.
    required: false
    default: 'off'
  github-token:
    description: Token for the PR comment. Used only by the comment step, never by the step that may start your server.
    required: false
    default: ${{ github.token }}

outputs:
  passed:
    description: '"true" when every gated section meets min-grade and the baseline comparison found no high-risk change.'
    value: ${{ steps.run.outputs.passed }}
  source:
    description: 'Where the tool list came from: "repo-static" (read from the source, nothing run), "command" or "tools-file".'
    value: ${{ steps.run.outputs.source }}
  grade-spec:
    description: Grade of the MCP specification section.
    value: ${{ steps.run.outputs.grade-spec }}
  grade-anthropic:
    description: Grade against the Anthropic (Claude) directory rules.
    value: ${{ steps.run.outputs.grade-anthropic }}
  grade-openai:
    description: Grade against the OpenAI (ChatGPT) directory rules.
    value: ${{ steps.run.outputs.grade-openai }}
  grade-security:
    description: Grade of the poisoning and hidden-text scan.
    value: ${{ steps.run.outputs.grade-security }}
  grade-quality:
    description: Grade of schema and description quality.
    value: ${{ steps.run.outputs.grade-quality }}
  grade-surface:
    description: Grade of write-surface design (empty when the server has no write tools).
    value: ${{ steps.run.outputs.grade-surface }}
  catalog-hash:
    description: SHA-256 of the canonical tool list.
    value: ${{ steps.run.outputs.catalog-hash }}
  sarif-file:
    description: Path of report.sarif, or empty.
    value: ${{ steps.run.outputs.sarif-file }}
  results-dir:
    description: Folder of the reports.
    value: ${{ steps.run.outputs.results-dir }}

runs:
  using: composite
  steps:
    # Inputs reach the script as environment variables, never by interpolation into a command.
    - name: Grade the tool list
      id: run
      shell: bash
      env:
        INPUT_TOOLS_FILE: ${{ inputs.tools-file }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_SHELL: ${{ inputs.shell }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_MIN_GRADE: ${{ inputs.min-grade }}
        INPUT_SECTIONS: ${{ inputs.sections }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_BADGE: ${{ inputs.badge }}
        INPUT_BADGE_DIR: ${{ inputs.badge-dir }}
        INPUT_RESULTS_DIR: ${{ inputs.results-dir }}
        INPUT_PUBLISH_HINT: ${{ inputs.publish-hint }}
        INPUT_PR_COMMENT: ${{ inputs.pr-comment }}
        MCP_CHECK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 20 ? 0 : 1)' 2>/dev/null || {
          echo "::error::mcp-check needs Node.js 20 or later on the runner (add actions/setup-node before this step)"
          exit 1
        }
        exec node "$GITHUB_ACTION_PATH/action/main.mjs"

    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.run.outputs.sarif-file != '' }}
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}
        category: mcp-check

    - name: Upload the reports
      if: ${{ always() && inputs.artifact-name != '' && steps.run.outputs.results-dir != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.results-dir }}
        if-no-files-found: warn

    # Only when main.mjs wrote a changed badge on the default branch. Commits badge.json and report.md
    # in badge-dir and nothing else, as github-actions[bot], with [skip ci] so it starts no workflow.
    - name: Commit the badge
      if: ${{ always() && steps.run.outputs.badge-changed == 'true' }}
      shell: bash
      env:
        BADGE_DIR: ${{ steps.run.outputs.badge-dir }}
        BRANCH: ${{ steps.run.outputs.badge-branch }}
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -- "$BADGE_DIR/badge.json" "$BADGE_DIR/report.md"
        if git diff --cached --quiet; then echo "badge unchanged"; exit 0; fi
        git commit -m "mcp-check: update badge [skip ci]" -- "$BADGE_DIR/badge.json" "$BADGE_DIR/report.md"
        for attempt in 1 2 3; do
          if git push origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
          # Someone pushed in between: rebase onto it and try again. A failed rebase is aborted, not fatal.
          if ! git pull --rebase origin "$BRANCH"; then git rebase --abort || true; fi
        done
        echo "::error::could not push the badge to $BRANCH (branch protection, or permissions contents: write missing)"
        exit 1

    # Only on pull requests from this repository, when pr-comment is auto or always. The token reaches this step
    # alone; a failure is a warning (the script exits 0, and the step may not fail the job either way).
    - name: Comment on the pull request
      if: ${{ always() && steps.run.outputs.pr-comment-action != '' }}
      continue-on-error: true
      shell: bash
      env:
        COMMENT_FILE: ${{ steps.run.outputs.pr-comment-file }}
        COMMENT_ACTION: ${{ steps.run.outputs.pr-comment-action }}
        PR_NUMBER: ${{ steps.run.outputs.pr-number }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        exec node "$GITHUB_ACTION_PATH/action/pr-comment.mjs"

    - name: Set the job status
      if: ${{ always() }}
      shell: bash
      env:
        EXIT_STATUS: ${{ steps.run.outputs.exit-status }}
      run: |
        if [ "$EXIT_STATUS" = "0" ]; then exit 0; fi
        echo "mcp-check: the job fails; the job summary says why."
        exit 1
